name: Willow scheduled jobs

on:
  schedule:
    # Evening reminder — daily at 18:30 local time (Asia/Kolkata here; change
    # timezone/cron to match where your users are).
    - cron: "30 18 * * *"
      timezone: "Asia/Kolkata"
    # Weekly digest — Sunday 19:00 local.
    - cron: "0 19 * * 0"
      timezone: "Asia/Kolkata"
    # Audio retention prune — nightly 04:30 local.
    - cron: "30 4 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch: # allow manual runs for testing

jobs:
  reminder:
    name: Evening reminder
    runs-on: ubuntu-latest
    # Daily 18:30 Asia/Kolkata — only fire when the schedule tick matches this
    # job, or on manual dispatch (which has no schedule value).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 18 * * *' }}
    steps:
      - name: Trigger reminder
        run: |
          curl -fsS -X POST "${{ vars.WILLOW_API_URL }}/api/cron/reminder" \
            -H "Authorization: Bearer ${{ secrets.WILLOW_CRON_SECRET }}"

  digest:
    name: Weekly digest
    runs-on: ubuntu-latest
    # Sunday 19:00 Asia/Kolkata.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 19 * * 0' }}
    steps:
      - name: Trigger digest
        run: |
          curl -fsS -X POST "${{ vars.WILLOW_API_URL }}/api/cron/digest" \
            -H "Authorization: Bearer ${{ secrets.WILLOW_CRON_SECRET }}"

  retention:
    name: Audio retention
    runs-on: ubuntu-latest
    # Nightly 04:30 Asia/Kolkata.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 4 * * *' }}
    steps:
      - name: Trigger retention
        run: |
          curl -fsS -X POST "${{ vars.WILLOW_API_URL }}/api/cron/retention" \
            -H "Authorization: Bearer ${{ secrets.WILLOW_CRON_SECRET }}"
