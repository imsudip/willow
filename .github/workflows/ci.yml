# Willow — CI: tests + typecheck on every PR and push.
#
# This is the cheap gate. The full deploy pipeline lives in deploy.yml and
# runs on push to main / release. Keeping them separate means PRs get fast
# feedback without redeploying prod.
#
# Note: `npm run lint` (eslint) is intentionally not gated here — the repo has
# no ESLint config yet, so it can't pass. Add it back once eslint is wired up.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "assets/**"]

# No secrets or deploy steps → lock permissions down completely.
permissions:
  contents: read

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    # Postgres for the API smoke tests (they boot the real app, which runs
    # migrate() at import time). Ephemeral per-job — free and fork-friendly.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: willow
          POSTGRES_PASSWORD: willow
          POSTGRES_DB: willow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U willow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://willow:willow@localhost:5432/willow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
