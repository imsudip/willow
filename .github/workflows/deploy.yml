# Willow — single pipeline that builds and deploys the Next.js app to Vercel.
#
# Triggered on push to main (and optionally on release). It:
#   1. Runs the full test suite + typecheck (gate).
#   2. Builds @willow/shared (the web app imports its dist).
#   3. Applies DB migrations to Neon (idempotent; DATABASE_URL from secrets).
#   4. Builds & deploys the Next.js app to Vercel (--prebuilt).
#   5. Runs a smoke test against the live production URL.
#   6. Tags a release.
#
# The app is now a single Next.js deploy: the API (Route Handlers), the SPA,
# auth, and cron endpoints all live in the same Vercel project. The old
# two-stage (Neon Functions API + Vercel static) pipeline is retired.
#
# External services (Neon project, R2 bucket, Vercel project, OpenAI account)
# are created once in their dashboards; this pipeline deploys to them and
# manages everything deployable.
#
# Required repo secrets/vars (one-time setup):
#   Secrets:
#     OPENAI_API_KEY, CRON_SECRET, AUTH_SECRET,
#     R2_API_TOKEN, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#     VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VERCEL_TOKEN, DATABASE_URL
#   Vars:
#     VERCEL_ORG_ID, VERCEL_PROJECT_ID, WILLOW_API_URL (Vercel prod URL, for cron),
#     WILLOW_PRODUCTION_URL, PUBLIC_ORIGIN, CRON_TIMEZONE, TRANSCRIPTION_MODEL,
#     CLEANUP_MODEL, R2_BUCKET, R2_STORAGE_LIMIT_BYTES,
#     MAX_UPLOADS_PER_USER_PER_DAY, MAX_AUDIO_UPLOAD_BYTES, VAPID_SUBJECT
#
# Populate secrets/vars in one go:
#   bash scripts/push-secrets-to-github.sh
#   gh secret set DATABASE_URL   # the Neon pooled connection string
#   gh variable set WILLOW_API_URL "$(vercel ...)"   # Vercel prod URL for cron

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "assets/**"]
  workflow_dispatch: {} # manual redeploy

# Read-only by default; only the finalize job (which tags a release) is
# granted write access to repository contents.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy (a deploy is the prod pointer)

env:
  # Vercel deploy target project (single project: apps/web).
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  # Production URL for the smoke test (defaults to the known Vercel alias).
  WILLOW_PRODUCTION_URL: ${{ vars.WILLOW_PRODUCTION_URL }}

jobs:
  # ── 1 · Gate: tests + typecheck ──────────────────────────────────────────
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    # Postgres for the shared/schema tests (vitest).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: willow
          POSTGRES_PASSWORD: willow
          POSTGRES_DB: willow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U willow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://willow:willow@localhost:5432/willow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # ── 2 · Deploy the Next.js app → Vercel (with migrations) ────────────────
  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Build @willow/shared first — the web app's Next build imports its
      # dist, which doesn't exist on a fresh runner.
      - name: Build @willow/shared
        run: npm run build -w @willow/shared

      # Apply DB migrations to Neon (idempotent). DATABASE_URL is the Neon
      # pooled connection string (same one the app uses at runtime).
      - name: Migrate database (Neon)
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      # Vercel's official CI pattern: pull → build --prod → deploy --prebuilt.
      # NOTE: `vercel pull` requires a TEAM-scoped (or full-account) VERCEL_TOKEN
      # — a project-scoped token fails with "Could not retrieve Project Settings".
      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # ── 3 · Smoke test + release (only when everything deployed) ─────────────
  finalize:
    name: Smoke test & release
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && needs.deploy.result == 'success'
    permissions:
      contents: write # for tagging a release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Smoke test: hit the deployed app's health endpoint on the stable
      # PRODUCTION alias (the deployment-specific URL from `vercel deploy`
      # isn't promoted/propagated to the edge immediately, so it can 302/404).
      - name: Smoke test live stack
        env:
          WILLOW_PRODUCTION_URL: ${{ env.WILLOW_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          PROD="${WILLOW_PRODUCTION_URL:-https://willow-alpha-one.vercel.app}"
          # Bounded timeouts so an unresponsive endpoint fails the probe
          # promptly instead of waiting out the runner job timeout.
          code=$(curl -sS --connect-timeout 10 --max-time 60 \
            -o /dev/null -w '%{http_code}' "$PROD/api/health" || true)
          echo "health on $PROD: HTTP $code"
          test "$code" = "200"

      # Tag a release (skipped if the commit already has a tag).
      - name: Tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "Commit already tagged; skipping."
          else
            TAG="release-$(date -u +%Y.%m.%d-%H%M%S)"
            git tag "$TAG"
            gh auth setup-git
            git push origin "$TAG"
            echo "Tagged $TAG"
          fi

